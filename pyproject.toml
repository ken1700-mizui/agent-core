[project]
name = "agent-core"
version = "0.0.0"
description = "Agent Core: a private AI agent platform for the owner's own use (Phase 1 foundation)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Approved runtime dependency (docs/decisions/PHASE_1_APPROVAL.md, docs/adr/0006-toolchain.md).
dependencies = [
    "pydantic>=2.12,<3",
]

[dependency-groups]
# Approved development dependencies only. Exact versions are locked in uv.lock.
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "import-linter>=2.5,<3",
]

[tool.uv]
# No build backend is used (no extra, unapproved build dependency).
# The project is not installed; src/ is put on the path by each tool's config.
package = false
required-version = ">=0.11"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src", "tools", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
# A test whose setup needs root is marked ``privileged``; without root it fails
# (never skipped). Non-root runs deselect it with -m "not privileged".
markers = [
    "privileged(reason): the setup needs a privilege only root has; runs only as root",
    "sandbox: needs the environment of E-1/E-2 (Docker daemon, P1/P2 OS users, root). Deselected unless -m names it; fails as SANDBOX_NOT_RUN when its environment is missing",
    "simulation: the D 16.1 statistical simulation (2,000 runs per scenario; minutes). Deselected unless -m names it",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tools", "tests"]
# Python sources only. Design documents in docs/ and *.md are never rewritten by tools.
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes (includes F401 unused imports)
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "S",       # bandit (security)
    "SIM",     # simplify
    "N",       # naming
    "PT",      # pytest style
    "RUF",     # ruff-specific
    "BLE",     # blind except (never swallow exceptions, AGENTS.md 4.6)
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and run the approved dev tools (ruff, mypy, lint-imports, git)
# as subprocesses with fixed argument lists and no shell.
"tests/**" = ["S101", "S603", "S607"]
# The secret scanner runs `git ls-files` with a fixed argument list and no shell.
"tools/secret_scan.py" = ["S603", "S607"]
# The statistics engine and its tests use seeded random.Random on purpose: the
# analysis must be reproducible from its recorded seed; nothing here is a secret.
"src/agent_core/stats/**" = ["S311"]
"tests/unit/test_wp2_07_*.py" = ["S101", "S311", "S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = ["src", "tools", "tests"]
plugins = ["pydantic.mypy"]
files = ["src", "tools", "tests"]
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- import-linter
# Run with src/ on the path: `PYTHONPATH=src uv run lint-imports`.
# WP-01 sets only contracts that apply to modules that exist now. Layer contracts
# for each Engine are added by the work package that creates the modules.
[tool.importlinter]
# WP-10: the CLI (agent_core_cli) is the composition root, outside agent_core.
# WP2-02: the P2 broker (agent_core_broker) is a separate process and package.
root_packages = ["agent_core", "agent_core_cli", "agent_core_broker"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "ports-and-adapters-layers"
name = "Ports & Adapters layers: runtime -> (adapters | identity | tool | observability) -> (safety | cost | context) -> ports -> types"
type = "layers"
# Higher layers may import lower ones, never the reverse. Siblings separated by
# "|" are independent: adapters and identity never import each other.
# Cycles between layers are reported because one direction is always upward.
layers = [
    "agent_core.runtime",
    "agent_core.adapters | agent_core.identity | agent_core.tool | agent_core.observability",
    # Pure safety and cost rules (WP-09): no I/O. The SQLite ledger that runs them
    # inside the Journal transaction is an adapter. The Context Engine (WP-14) is
    # pure too and independent of both (B1 1.1, C16).
    # WP2-06: the Planning Engine is pure too and proposes only (no authority).
    "agent_core.safety | agent_core.cost | agent_core.context | agent_core.planning",
    "agent_core.ports",
    "agent_core.types",
]

[[tool.importlinter.contracts]]
id = "core-independent-of-storage"
name = "Core (types, ports, identity, runtime) does not depend on SQLite, OS locks or adapters"
type = "forbidden"
source_modules = [
    "agent_core.types",
    "agent_core.ports",
    "agent_core.identity",
    "agent_core.runtime",
    "agent_core.tool",
    "agent_core.observability",
    "agent_core.safety",
    "agent_core.cost",
    "agent_core.context",
    "agent_core.planning",
]
forbidden_modules = ["sqlite3", "fcntl", "agent_core.adapters"]

[[tool.importlinter.contracts]]
id = "file-broker-composition-root"
name = "WP-08: no agent_core module imports the file broker; the runtime uses FileOperationPort"
type = "forbidden"
# "agent_core.**" names every module one by one. A plain "agent_core" (or
# "agent_core.adapters") is an ancestor of the broker, and import-linter then
# skips the imports inside it without reporting anything.
source_modules = ["agent_core.**"]
forbidden_modules = ["agent_core.adapters.file_broker"]

[[tool.importlinter.contracts]]
id = "core-independent-of-cli"
name = "WP-10: no agent_core module imports the CLI (the CLI composes the core, never the reverse)"
type = "forbidden"
source_modules = ["agent_core.**"]
forbidden_modules = ["agent_core_cli"]

[[tool.importlinter.contracts]]
id = "evaluation-records-off-the-agent-path"
name = "WP2-01: the agent path never imports the evaluation store or ports (D.V4, D.V8)"
type = "forbidden"
# The agent under evaluation cannot write or classify evaluation records. Only
# the evaluation side (WP2-12 controller, graders) composes them.
source_modules = [
    "agent_core.runtime",
    "agent_core.tool",
    "agent_core.safety",
    "agent_core.cost",
    "agent_core.context",
    "agent_core.identity",
    "agent_core.observability",
    "agent_core_cli",
]
forbidden_modules = ["agent_core.adapters.sqlite_results", "agent_core.ports.evaluation"]

[[tool.importlinter.contracts]]
id = "p1-does-not-run-p2"
name = "WP2-02: no agent_core module imports the P2 broker (P1 talks to it over IPC only)"
type = "forbidden"
source_modules = ["agent_core.**", "agent_core_cli"]
forbidden_modules = ["agent_core_broker"]

[[tool.importlinter.contracts]]
id = "p2-broker-isolation"
name = "WP2-02: the P2 broker uses only agent_core.types: no journal, ledger, runtime, network or process"
type = "forbidden"
# P2 never reads or writes the Journal or the ledger (sandbox design 7.6.1). Its
# only socket use is its AF_UNIX server. No process is spawned (fake backend).
source_modules = ["agent_core_broker"]
# D17 (2026-11-28): the one exception. P2's Docker API module uses the standard
# http.client over an AF_UNIX socket to the Docker daemon only (no TCP, no TLS,
# no other host). No other broker module may import http.
ignore_imports = ["agent_core_broker.docker_api -> http"]
forbidden_modules = [
    "agent_core.adapters",
    "agent_core.runtime",
    "agent_core.safety",
    "agent_core.cost",
    "agent_core.context",
    "agent_core.tool",
    "agent_core.identity",
    "agent_core.observability",
    "agent_core_cli",
    "sqlite3",
    "ssl",
    "http",
    "urllib",
    "requests",
    "httpx",
    "aiohttp",
    "socketserver",
    "asyncio",
    "subprocess",
    "_posixsubprocess",
    "multiprocessing",
    "pty",
    "ctypes",
    "anthropic",
    "openai",
]

[[tool.importlinter.contracts]]
id = "phase1-no-network-or-process"
name = "Phase 1: agent_core and its CLI have no network, provider SDK or process-spawning code path"
type = "forbidden"
source_modules = ["agent_core", "agent_core_cli"]
# S-5 (D16, 2026-11-28): the one exception. P1's broker client opens AF_UNIX
# stream sockets to the P2 broker and nothing else (no internet family, no name
# resolution: tests/unit/test_wp2_02_broker.py checks its source). No other
# module may import socket.
ignore_imports = ["agent_core.adapters.broker_client -> socket"]
forbidden_modules = [
    # Network (PHASE_1_IMPLEMENTATION_PLAN.md section 2, item 5)
    "socket",
    "ssl",
    "http",
    "urllib",
    "ftplib",
    "smtplib",
    "imaplib",
    "poplib",
    "xmlrpc",
    "requests",
    "httpx",
    "aiohttp",
    # Provider SDKs are not approved in Phase 1
    "anthropic",
    "openai",
    "socketserver",
    # Low-level and asynchronous network and process APIs. asyncio is not needed in
    # Phase 1; allowing it later requires an ADR.
    "_socket",
    "asyncio",
    # No arbitrary command execution in Phase 1 (ROADMAP 0.1). Calls through os
    # (os.system, os.exec*, os.spawn*, os.fork ...) are checked by
    # tests/unit/test_no_process_execution.py, which import-linter cannot see.
    "subprocess",
    "_posixsubprocess",
    "multiprocessing",
    "pty",
    "ctypes",
]
