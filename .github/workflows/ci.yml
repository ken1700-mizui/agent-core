# Agent Core CI (WP-01).
#
# Trigger: manual dispatch ONLY. Pushes and pull requests do not start this
# workflow, so opening a PR cannot consume Actions minutes by accident. Do not
# add automatic triggers without the owner's approval.
#
# Network: the only network use is installing uv and the locked dependencies.
# Every later step runs `uv run --locked --offline`, so uv neither re-resolves
# nor downloads anything. This limits uv only; it is not OS-level isolation.
#
# Secrets: none are used. Permissions are read-only and the checkout does not
# keep credentials.
#
# Privileged tests (tests/support/privileged.py): a test whose setup needs root
# (CAP_MKNOD, CAP_CHOWN) fails as PRIVILEGED_NOT_RUN without root; it is never
# skipped. The ordinary tests run as the runner's user with -m "not privileged";
# the privileged ones run as root in their own step with -m privileged (an empty
# selection fails: pytest exits 5). GitHub's documentation says the Linux
# runners use passwordless sudo.
#
# Dispatch: GitHub's documentation says that to trigger workflow_dispatch the
# workflow must be in the default branch. The owner-approved copy of this
# definition is on the default branch (main, d0b8635), so a manual dispatch
# against this branch is possible. Each run needs the owner's separate approval.
# State as of 2026-11-27: the first run (run 46031933145) checked 71208ad and
# passed all 2138 tests; later commits (2340 tests at aae033a) are not yet
# checked by CI (docs/reviews/PHASE_1_ACCEPTANCE.md, sections 8 and 11).
#
# Supply chain (WP01-R03): the actions are GitHub's own, pinned to full commit
# SHAs read on 2026-11-27 from the official repositories (git ls-remote of the
# release tags; lightweight tags, so the SHA is the commit):
#   actions/checkout     v6.1.0 (= v6)  d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-python v6.3.0 (= v6)  ece7cb06caefa5fff74198d8649806c4678c61a1
# v6 of both runs on node24. Node 20 is no longer available on GitHub Actions
# runners (GitHub changelog, 2026-09-23), and the earlier pins (checkout v4,
# setup-python v5) were node20 actions. uv itself is installed by hash
# (tools/ci/uv-requirements.txt). Sources: docs/design/phase-1/WP-13_INTEGRATION.md.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_VERSION: "0.11.32"
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Record the commit and the environment
        run: |
          {
            echo "commit: $(git rev-parse HEAD) (GITHUB_SHA ${GITHUB_SHA}, ref ${GITHUB_REF})"
            echo "runner: ${RUNNER_OS} ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "kernel: $(uname -srm)"
            echo "user: $(id)"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Secret scan of the checked-out commit (stdlib only, before any download)
        run: python -I tools/secret_scan.py --mode commit --rev HEAD

      - name: Install uv (hash-checked, binary only)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: --no-deps -r tools/ci/uv-requirements.txt
          { python --version; uv --version; } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies (last step that uses the network)
        run: uv sync --locked

      - name: Check that the environment matches uv.lock
        run: uv sync --locked --offline --check

      - name: ruff check
        run: uv run --locked --offline ruff check .

      - name: ruff format --check
        run: uv run --locked --offline ruff format --check .

      - name: mypy
        run: uv run --locked --offline mypy

      - name: import-linter
        env:
          PYTHONPATH: src
        run: uv run --locked --offline lint-imports

      - name: pytest (ordinary tests, as the runner's user)
        run: uv run --locked --offline pytest -m "not privileged"

      - name: pytest (privileged tests, as root)
        run: sudo "${PWD}/.venv/bin/python" -m pytest -p no:cacheprovider -m privileged
