# Agent Core CI (WP-01).
#
# - Runs only on pull requests and on manual dispatch, so pushing a branch does
#   not consume Actions minutes. Use is limited to the GitHub Actions free tier
#   (docs/decisions/PHASE_1_APPROVAL.md).
# - Uses no secrets and no real API. The only network use is fetching the
#   locked dependencies; every later step runs with UV_OFFLINE=1.
# - Only GitHub's own actions are used; uv is installed from PyPI at a pinned
#   version.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_VERSION: "0.11.32"
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret scan (stdlib only, before any dependency is fetched)
        run: python -I tools/secret_scan.py

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies (the only network step)
        run: uv sync --locked

      - name: Check that the environment matches uv.lock
        env:
          UV_OFFLINE: "1"
        run: uv sync --locked --check

      - name: ruff check
        env:
          UV_OFFLINE: "1"
        run: uv run ruff check .

      - name: ruff format --check
        env:
          UV_OFFLINE: "1"
        run: uv run ruff format --check .

      - name: mypy
        env:
          UV_OFFLINE: "1"
        run: uv run mypy

      - name: import-linter
        env:
          UV_OFFLINE: "1"
          PYTHONPATH: src
        run: uv run lint-imports

      - name: pytest
        env:
          UV_OFFLINE: "1"
        run: uv run pytest
