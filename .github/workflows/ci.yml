# Agent Core CI (WP-01).
#
# Trigger: manual dispatch ONLY. Pushes and pull requests do not start this
# workflow, so opening a PR cannot consume Actions minutes by accident. Do not
# add automatic triggers until the owner has confirmed the GitHub Actions free
# tier and the conditions that prevent charges (docs/STATUS.md).
#
# Network: the only network use is installing uv and the locked dependencies.
# Every later step runs `uv run --locked --offline`, so uv neither re-resolves
# nor downloads anything. This limits uv only; it is not OS-level isolation.
#
# Secrets: none are used. Permissions are read-only and the checkout does not
# keep credentials.
#
# Supply chain (WP01-R03, open item): the actions below are GitHub's own, but
# they are referenced by tag, not by commit SHA. The official SHAs have not
# been verified because no external lookup was authorized; they must not be
# guessed. Pin them once the SHAs are verified (docs/STATUS.md).
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_VERSION: "0.11.32"
      UV_PYTHON_DOWNLOADS: never
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret scan of the checked-out commit (stdlib only, before any download)
        run: python -I tools/secret_scan.py --mode commit --rev HEAD

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"

      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies (last step that uses the network)
        run: uv sync --locked

      - name: Check that the environment matches uv.lock
        run: uv sync --locked --offline --check

      - name: ruff check
        run: uv run --locked --offline ruff check .

      - name: ruff format --check
        run: uv run --locked --offline ruff format --check .

      - name: mypy
        run: uv run --locked --offline mypy

      - name: import-linter
        env:
          PYTHONPATH: src
        run: uv run --locked --offline lint-imports

      - name: pytest
        run: uv run --locked --offline pytest
